<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="Design/all.css">
    <link rel="stylesheet" href="Design/header.css">
    <link rel="stylesheet" href="Design/contact.css">    
  </head>
  <body>

    <header class="header">
      <div class="left-section">
        <img class="logo">
        <div class="club-name">
          Logo
        </div>
      </div>

      <nav>
        <div class="right-section">
          <div class="jump-about">
            About Us
          </div>
          <div class="jump-events">
            Events
          </div>
          <div class="jump-sponsers">
            Sponsers
          </div>
          <a href="contact.html">
            Contact
          </a>
        </div>
      </nav>
      
    </header>


    <section class="contact">
      <div class="contact-page">
          <div>
            <p class="heading">
            What is your name?
          </p>
          <input class="name-bar" type="text" placeholder="Your Name">
          </div>
          
          <div>
          <p class="heading">
            What is your email?
          </p>
          <input class="email-bar" type="text" placeholder="Your Email">
          </div>

          <div>
          <p class="heading">
            Tell us about yourself!
          </p>
          <input class="about-you" type="text" placeholder="Your Message">
          </div>
          

          <button class="send">
            Send
          </button>

          <p class="heading">
            Follow Our Socials!
          </p>
          <p class="text">
            LinkTree
          </p>
          <p class="text">
            Instagram
          </p>
          <p class="text">
            Discord
          </p>

    </div>
  </section>
  </body>
  
</html>
