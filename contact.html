<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="Design/all.css">
    <link rel="stylesheet" href="Design/header.css">
    <link rel="stylesheet" href="Design/contact.css">    
  </head>
  <body>

    <header class="header">
      <div class="left-section">
        <img class="logo">
        <a class="club-name" href="homepage.html">
          Logo
        </a>
      </div>

      <nav>
        <div class="right-section">
          <a href="about.html">
            About Us
          </a>
          <a href="homepage.html#events">
            Events
          </a>
          <a href="sponsers.html">
            Sponsers
          </a>
          <a href="contact.html">
            Contact
          </a>
        </div>
      </nav>
      
    </header>


    <section class="contact">
      <div class="contact-page">
          <div>
            <p class="heading">
              CONTACT US!
            </p>
          </div>

          <form id="contactForm">
            <p class="heading">
              What is your name?
            </p>            
            <input class="name-bar" type="text" id="name" placeholder="Your Name">
            
            <p class="heading">
              What is your email address?
            </p>
            <input class="email-bar" type="email" id="email" placeholder="Your email">
            
            <p class="heading">
              What is your message?
            </p>
            <textarea class="message-bar" id="message" placeholder="Your message"></textarea>
            

            <button class="send" type="submit">
              Send
            </button>
          </form>
          

          <p class="heading">
            Follow Our Socials!
          </p>

          <div class="socials">
            <div class="linktree">
              <img class="socials-pic" src="pictures/LinkTree.png">
              <a href="https://linktr.ee/animeclubuofc" target="_blank">
                LinkTree
              </a>
            </div>
            
            <div class="instagram">
              <img class="socials-pic" src="pictures/Instagram.png">
              <a href="https://www.instagram.com/animeclubuofc/" target="_blank">
                Instagram
              </a>
            </div>
            
            <div class="discord">
              <img class="socials-pic" src="pictures/Discord.png">
              <a href="https://discord.gg/wBKq22DBD" target="_blank">
                Discord
              </a>
            </div>
            
          </div>
          
          
          

    </div>
  </section>

  </body>
  
</html>
