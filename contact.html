<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="Design/all.css">
    <link rel="stylesheet" href="Design/homepage.css">
    <link rel="stylesheet" href="Design/header.css">
    <link rel="stylesheet" href="Design/about.css">
    <link rel="stylesheet" href="Design/events.css">
    <link rel="stylesheet" href="Design/contact.css">
    <link rel="stylesheet" href="Design/sponsers.css">
    <link rel="stylesheet" href="Design/footer.css">
  </head>

  <body>  
    <header class="header">
      <div class="left-section">
        <img class="logo">
        <a class="club-name" href="homepage.html">
          Logo
        </a>
      </div>

      <nav class="header-menu">
        <a href="about.html">
          About Us
        </a>
        <a href="events.html">
          Events
        </a>
        <a href="sponsers.html">
          Sponsers
        </a>
        <a href="contact.html">
          Contact
        </a>
      </nav>

      
      <img class="menu-icon" id= "menuIcon" src="pictures/hamburger-menu.svg">

      <div class="slidein-menu" id="slideinMenu">
        <a href="about.html">
          About Us
        </a>
        <a href="events.html">
          Events
        </a>
        <a href="sponsers.html">
          Sponsers
        </a>
        <a href="contact.html">
          Contact
        </a>
      </div>
    </header>


    <section class="contact">
      <div class="contact-page">
          <div>
            <p class="heading">
              CONTACT US!
            </p>
          </div>

          <form id="contactForm">
            <p class="heading">
              What is your name?
            </p>            
            <input class="name-bar" type="text" id="name" name="name" placeholder="Your name" required>
            
            <p class="heading">
              What is the subject of your email?
            </p>            
            <input class="subject-bar" type="text" id="subject" name="subject" placeholder="Your subject" required>
            
            <p class="heading">
              What is your email address?
            </p>
            <input class="email-bar" type="email" id="email" name="email" placeholder="Your email" required>
            
            <p class="heading">
              What is your message?
            </p>
            <textarea class="message-bar" id="message" name="message" placeholder="Your message" required></textarea>
            

            <button class="send" type="submit">
              Send
            </button>

            <p id="sendMessage"></p>
          </form>
          

          <p class="heading">
            Follow Our Socials!
          </p>

          <div class="socials">
            <div class="linktree">
              <a href="https://linktr.ee/animeclubuofc" target="_blank">
                LinkTree
              </a>
            </div>
            
            <div class="instagram">
              <a href="https://www.instagram.com/animeclubuofc/" target="_blank">
                Instagram
              </a>
            </div>
            
            <div class="discord">
              <a href="https://discord.gg/wBKq22DBD" target="_blank">
                Discord
              </a>
            </div>            
          </div>
          
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="contact.js"></script>
  <script src="dropdown-menu.js"></script>  
  </body>
</html>
